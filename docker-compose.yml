services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luminarias
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luminarias"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/luminarias?schema=public
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_PROFILE: ${AWS_PROFILE}
      # Las credenciales no se copian a la imagen: se montan desde tu equipo.
      # Sirve con `aws login` (login/cache) y con llaves de acceso (credentials).
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_LOGIN_CACHE_DIRECTORY: /aws/login/cache
    volumes:
      # Credenciales en solo lectura; solo la caché del token admite escritura,
      # porque el SDK guarda ahí el token cuando lo renueva.
      - ~/.aws:/aws:ro
      - ~/.aws/login:/aws/login
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && exec node dist/main"

volumes:
  pgdata: